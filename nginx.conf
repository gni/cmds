server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Redirect root to /cmds/
    location = / {
        return 301 /cmds/;
    }

    # Serve cmds app
    location /cmds/ {
        alias /usr/share/nginx/html/cmds/;
        index index.html;
        try_files $uri $uri/ /cmds/index.html;

        # Cache static assets
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
